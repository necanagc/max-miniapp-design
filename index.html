<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Умный квартал</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="assets/js/app.js"></script>

</head>

<body>

    <div class="app">

        <header>

            <div>

                <span class="caption">Дом</span>

                <h1>ул. Ленина, 25</h1>

            </div>

            <button class="avatar">

                <i data-lucide="user"></i>

            </button>

        </header>

        <main>

            <a class="create" href="pages/create/index.html">

                <div>

                    <span>Сообщить о проблеме</span>

                    <small>Сделать фото и описать ситуацию</small>

                </div>

                <i data-lucide="arrow-right"></i>

            </a>

            <section class="updates">


                <h2>Сегодня</h2>

                <div class="update">

                    <i data-lucide="bell"></i>

                    <span>Новое объявление от председателя</span>

                </div>

                <div class="update">

                    <i data-lucide="triangle-alert"></i>

                    <span>5 обращений ожидают подтверждения</span>

                </div>

            </section>

            <section class="issues">

    <div class="section-title">

        <h2>Последние обращения</h2>

        <a href="#">Все</a>

    </div>

    <div class="empty-state">

        <div class="empty-icon">

            <i data-lucide="camera"></i>

        </div>

        <h3>Пока нет обращений</h3>

        <p>
            Создайте первое обращение или дождитесь появления новых.
        </p>

    </div>

</section>

        </main>

        <nav>

            <a class="active" href="index.html">

                <i data-lucide="house"></i>

                <span>Главная</span>

            </a>

            <a href="pages/problems/index.html">

                <i data-lucide="triangle-alert"></i>

                <span>Проблемы</span>

            </a>

            <a href="pages/news/index.html">

                <i data-lucide="bell"></i>

                <span>Новости</span>

            </a>

            <a href="pages/profile/index.html">

                <i data-lucide="user"></i>

                <span>Профиль</span>

            </a>

        </nav>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
