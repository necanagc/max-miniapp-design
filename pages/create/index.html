<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Новое обращение</title>

<link rel="stylesheet" href="../../assets/css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<header>

<div>

<span class="caption">Новое обращение</span>

<h1>Сообщить о проблеме</h1>

</div>

<button class="avatar" onclick="history.back()">

<i data-lucide="arrow-left"></i>

</button>

</header>

<main>

<form class="create-form">

<section class="form-block">

<h2>Фотографии</h2>

<div class="photos-grid" id="photosGrid">

<label class="photo-add">

<input
id="photoInput"
type="file"
accept="image/*"
multiple
hidden>

<i data-lucide="plus"></i>

<span>Добавить</span>

</label>

</div>

<p class="hint">
Можно прикрепить до 10 фотографий.
</p>

</section>

<section class="form-block">

<h2>Категория</h2>

<select>

<option>Освещение</option>
<option>Мусор</option>
<option>Дороги</option>
<option>Подъезд</option>
<option>Парковка</option>
<option>Благоустройство</option>
<option>Другое</option>

</select>

</section>

<section class="form-block">

<h2>Адрес</h2>

<input
class="text-input"
type="text"
value="ул. Ленина, 25"
readonly>

</section>

<section class="form-block">

<h2>Описание</h2>

<textarea
placeholder="Опишите проблему подробнее..."></textarea>

</section>

<section class="form-block">

<label class="checkbox-row">

<input type="checkbox">

<span>

Я подтверждаю, что информация достоверна.

</span>

</label>

</section>

<a href="../issue/index.html" class="submit-btn">

Опубликовать обращение

</a>

</form>

</main>

<nav>

<a href="../../index.html">

<i data-lucide="house"></i>

<span>Главная</span>

</a>

<a href="../problems/index.html">

<i data-lucide="triangle-alert"></i>

<span>Проблемы</span>

</a>

<a href="../news/index.html">

<i data-lucide="bell"></i>

<span>Новости</span>

</a>

<a href="../community/index.html">

<i data-lucide="users-round"></i>

<span>Сообщество</span>

</a>

<a href="../profile/index.html">

<i data-lucide="user"></i>

<span>Профиль</span>

</a>

</nav>

</div>

<script src="../../assets/js/app.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>

lucide.createIcons();

const input = document.getElementById("photoInput");
const grid = document.getElementById("photosGrid");

let photos = [];

input.addEventListener("change", function(){

photos=[...photos,...Array.from(this.files)];

renderPhotos();

input.value="";

});

function renderPhotos(){

grid.querySelectorAll(".photo-item").forEach(e=>e.remove());

photos.forEach((file,index)=>{

const reader=new FileReader();

reader.onload=function(e){

const item=document.createElement("div");

item.className="photo-item";

item.innerHTML=`
<img src="${e.target.result}">
<button class="photo-remove">&times;</button>
`;

item.querySelector("button").onclick=()=>{

photos.splice(index,1);

renderPhotos();

};

grid.insertBefore(item,grid.firstElementChild);

};

reader.readAsDataURL(file);

});

}

</script>

</body>

</html>
